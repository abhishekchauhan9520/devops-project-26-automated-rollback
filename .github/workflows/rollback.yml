name: Rollback Controls

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/*.sh tests/*.sh
      - name: Rollback state-machine tests
        run: bash tests/test_rollback.sh
